<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="SIR Student Portal — Secure access to student performance, tests, progress and weekly reviews.">

  <title>Student Portal | SIR Kolhapur</title>

  <link rel="icon" type="image/png" href="sir logo.png">

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    /* =========================================
       SIR STUDENT PORTAL
       LOGIN PAGE
    ========================================= */

    :root {
      --sir-navy: #071426;
      --sir-navy-light: #0d1d33;
      --sir-gold: #d9a72e;
      --sir-white: #f7f8fa;
      --sir-muted: #9da9b8;
      --sir-border: rgba(255,255,255,0.10);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(217,167,46,0.10),
          transparent 35%
        ),
        var(--sir-navy);

      color: var(--sir-white);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }


    .portal-shell {
      width: 100%;
      max-width: 460px;
    }


    .portal-card {
      background:
        rgba(13,29,51,0.92);

      border:
        1px solid var(--sir-border);

      border-radius: 24px;

      padding: 42px 36px;

      box-shadow:
        0 25px 80px rgba(0,0,0,0.35);

      backdrop-filter: blur(16px);
    }


    .portal-logo {
      width: 82px;
      height: 82px;

      object-fit: contain;

      display: block;

      margin:
        0 auto 26px;
    }


    .portal-label {
      text-align: center;

      color: var(--sir-gold);

      font-size: 12px;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 12px;

      font-weight: 700;
    }


    h1 {
      text-align: center;

      font-size:
        clamp(30px, 6vw, 42px);

      line-height: 1.05;

      margin-bottom: 14px;
    }


    .portal-intro {
      text-align: center;

      color: var(--sir-muted);

      font-size: 15px;

      line-height: 1.7;

      margin-bottom: 34px;
    }


    .field {
      margin-bottom: 18px;
    }


    .field label {
      display: block;

      font-size: 13px;

      color: #dce2e9;

      margin-bottom: 8px;

      font-weight: 600;
    }


    .field input {
      width: 100%;

      height: 54px;

      border-radius: 12px;

      border:
        1px solid var(--sir-border);

      background:
        rgba(255,255,255,0.045);

      color: white;

      padding:
        0 16px;

      outline: none;

      font-size: 15px;

      transition:
        0.2s ease;
    }


    .field input::placeholder {
      color: #6f7c8c;
    }


    .field input:focus {
      border-color:
        var(--sir-gold);

      box-shadow:
        0 0 0 3px
        rgba(217,167,46,0.10);
    }


    .login-button {
      width: 100%;

      height: 56px;

      border: none;

      border-radius: 12px;

      background:
        var(--sir-gold);

      color:
        #071426;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 8px;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }


    .login-button:hover {
      transform:
        translateY(-1px);
    }


    .login-button:disabled {
      opacity: 0.6;

      cursor:
        not-allowed;

      transform:
        none;
    }


    .message {
      display: none;

      margin-top: 18px;

      padding:
        13px 15px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.5;
    }


    .message.show {
      display: block;
    }


    .message.error {
      background:
        rgba(220,70,70,0.10);

      border:
        1px solid
        rgba(220,70,70,0.25);

      color:
        #ffb5b5;
    }


    .message.info {
      background:
        rgba(217,167,46,0.08);

      border:
        1px solid
        rgba(217,167,46,0.20);

      color:
        #ead18d;
    }


    .portal-footer {
      text-align: center;

      margin-top: 26px;

      color:
        #697789;

      font-size: 12px;

      line-height: 1.6;
    }


    .back-link {
      display: block;

      text-align: center;

      margin-top: 22px;

      color:
        var(--sir-muted);

      text-decoration: none;

      font-size: 13px;
    }


    .back-link:hover {
      color:
        var(--sir-gold);
    }


    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .portal-card {
        padding:
          34px 22px;

        border-radius:
          20px;
      }

      .portal-logo {
        width: 70px;
        height: 70px;
      }

    }

  </style>

</head>


<body>


  <main class="portal-shell">


    <section class="portal-card">


      <!-- SIR LOGO -->

      <img
        src="sir logo.png"
        alt="Suryavanshi Institute for Rankers"
        class="portal-logo"
      >


      <!-- LABEL -->

      <div class="portal-label">
        SIR Student Portal
      </div>


      <!-- TITLE -->

      <h1>
        Your preparation.<br>
        Your progress.
      </h1>


      <!-- INTRO -->

      <p class="portal-intro">
        Access your academic performance,
        test progress and teacher reviews
        through your secure student account.
      </p>


      <!-- LOGIN FORM -->

      <form id="student-login-form">


        <!-- UID -->

        <div class="field">

          <label for="student-uid">
            Student UID
          </label>

          <input
            type="text"
            id="student-uid"
            name="student_uid"
            placeholder="Enter your Student UID"
            autocomplete="username"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="student-password">
            Password
          </label>

          <input
            type="password"
            id="student-password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          class="login-button"
          id="login-button"
        >
          Access Student Portal
        </button>


      </form>


      <!-- MESSAGE -->

      <div
        id="login-message"
        class="message"
        role="alert"
      ></div>


      <!-- BACK -->

      <a
        href="index.html"
        class="back-link"
      >
        ← Back to SIR
      </a>


      <!-- FOOTER -->

      <div class="portal-footer">

        Suryavanshi Institute for Rankers
        <br>

        Where Potential Finds Direction

      </div>


    </section>


  </main>



  <!-- =========================================
       STUDENT LOGIN JAVASCRIPT
  ========================================== -->

  <script>


    /* =========================================
       SUPABASE CONFIGURATION
    ========================================= */

    const SUPABASE_URL =
      "https://asbyosqpupqspzvqqhfj.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5kLRY64Pv5Ct-ZXuNtgEAw_51YUDqyw";


    const STUDENT_LOGIN_FUNCTION =
      `${SUPABASE_URL}/functions/v1/student-login`;


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            storageKey: "sir_student_auth",
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
          }
        }
      );



    /* =========================================
       LOGIN ELEMENTS
    ========================================= */

    const loginForm =
      document.getElementById(
        "student-login-form"
      );


    const loginButton =
      document.getElementById(
        "login-button"
      );


    const loginMessage =
      document.getElementById(
        "login-message"
      );



    /* =========================================
       MESSAGE FUNCTION
    ========================================= */

    function showMessage(
      message,
      type = "info"
    ) {

      loginMessage.textContent =
        message;

      loginMessage.className =
        `message show ${type}`;

    }



    /* =========================================
       STUDENT LOGIN
    ========================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /* Get UID */

        const uid =
          document
            .getElementById(
              "student-uid"
            )
            .value
            .trim()
            .toUpperCase();


        /* Get password */

        const password =
          document
            .getElementById(
              "student-password"
            )
            .value;



        /* =====================================
           VALIDATION
        ===================================== */

        if (!uid || !password) {

          showMessage(
            "Please enter your Student UID and password.",
            "error"
          );

          return;

        }



        /* =====================================
           LOADING STATE
        ===================================== */

        loginButton.disabled =
          true;

        loginButton.textContent =
          "Signing in...";


        showMessage(
          "Verifying your student account...",
          "info"
        );



        try {


          /* ===================================
             CALL EDGE FUNCTION
          =================================== */

          const response =
            await fetch(
              STUDENT_LOGIN_FUNCTION,
              {

                method: "POST",

                headers: {

                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_PUBLISHABLE_KEY

                },

                body:
                  JSON.stringify({

                    student_uid:
                      uid,

                    password:
                      password

                  })

              }
            );



          /* ===================================
             READ RESPONSE
          =================================== */

          const result =
            await response.json();


          console.log(
            "Student login response:",
            result
          );



          /* ===================================
             LOGIN FAILED
          =================================== */

          if (
            !response.ok ||
            !result.success ||
            !result.session
          ) {

            showMessage(
              result.error ||
              "Invalid Student UID or password.",
              "error"
            );


            loginButton.disabled =
              false;


            loginButton.textContent =
              "Access Student Portal";


            return;

          }



          /* ===================================
             CREATE SUPABASE SESSION
          =================================== */

          const {
            error: sessionError
          } =
            await supabaseClient
              .auth
              .setSession({

                access_token:
                  result.session
                    .access_token,

                refresh_token:
                  result.session
                    .refresh_token

              });



          /* ===================================
             SESSION ERROR
          =================================== */

          if (sessionError) {

            console.error(
              "Session error:",
              sessionError
            );


            showMessage(
              "Login succeeded, but your session could not be created. Please try again.",
              "error"
            );


            loginButton.disabled =
              false;


            loginButton.textContent =
              "Access Student Portal";


            return;

          }



          /* ===================================
             LOGIN SUCCESS
          =================================== */

          showMessage(
            `Welcome, ${result.student.name}. Opening your portal...`,
            "info"
          );


          loginButton.textContent =
            "Login successful";



          /* ===================================
             OPEN DASHBOARD
          =================================== */

          setTimeout(
            () => {

              window.location.href =
                "student-dashboard.html";

            },
            700
          );


        }


        /* =====================================
           UNEXPECTED / NETWORK ERROR
        ===================================== */

        catch (error) {

          console.error(
            "Student login error:",
            error
          );


          showMessage(
            "Unable to connect to the student portal. Please try again.",
            "error"
          );


          loginButton.disabled =
            false;


          loginButton.textContent =
            "Access Student Portal";

        }

      }
    );

  </script>


</body>

</html>
