<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07152f"
    >

    <title>
        Teacher Login | SIR Kolhapur
    </title>

    <meta
        name="description"
        content="Teacher Portal login for Suryavanshi Institute for Rankers."
    >

    <link
        rel="icon"
        href="sir-logo.svg"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =================================================
           RESET
        ================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020711 0%,
                    #07152f 50%,
                    #0c2854 100%
                );

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            overflow-x: hidden;
        }


        /* =================================================
           BACKGROUND
        ================================================= */

        body::before {

            content: "";

            position: fixed;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(215,166,42,.13),
                    transparent 68%
                );

            top: -250px;
            right: -200px;

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(35,102,190,.12),
                    transparent 68%
                );

            bottom: -250px;
            left: -200px;

            pointer-events: none;
        }


        /* =================================================
           CONTAINER
        ================================================= */

        .login-wrapper {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 430px;
        }


        /* =================================================
           BACK HOME
        ================================================= */

        .back-home {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 18px;

            color:
                rgba(255,255,255,.55);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .08em;

            text-decoration: none;

            transition: .3s ease;
        }


        .back-home:hover {

            color: #f0c75e;

            transform:
                translateX(-3px);
        }


        /* =================================================
           CARD
        ================================================= */

        .login-card {

            width: 100%;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 20px;

            padding:
                42px 38px;

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 35px 90px
                rgba(0,0,0,.35);
        }


        /* =================================================
           LOGO
        ================================================= */

        .logo-box {

            display: flex;

            justify-content: center;

            margin-bottom: 28px;
        }


        .logo-box img {

            width: 150px;

            max-height: 90px;

            object-fit: contain;
        }


        /* =================================================
           HEADING
        ================================================= */

        .portal-label {

            text-align: center;

            color: #f0c75e;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: .25em;

            margin-bottom: 12px;

            text-transform: uppercase;
        }


        h1 {

            text-align: center;

            font-size: 30px;

            line-height: 1.1;

            font-weight: 600;

            letter-spacing: -.03em;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color:
                rgba(255,255,255,.52);

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 32px;
        }


        /* =================================================
           FORM
        ================================================= */

        .form-group {

            margin-bottom: 19px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color:
                rgba(255,255,255,.72);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .06em;
        }


        input {

            width: 100%;

            height: 50px;

            padding:
                0 15px;

            border:
                1px solid
                rgba(255,255,255,.13);

            border-radius: 10px;

            outline: none;

            background:
                rgba(0,0,0,.20);

            color: #ffffff;

            font-size: 14px;

            transition:
                border-color .3s ease,
                background .3s ease,
                box-shadow .3s ease;
        }


        input::placeholder {

            color:
                rgba(255,255,255,.30);
        }


        input:focus {

            border-color:
                rgba(215,166,42,.75);

            background:
                rgba(0,0,0,.28);

            box-shadow:
                0 0 0 3px
                rgba(215,166,42,.08);
        }


        /* =================================================
           PASSWORD
        ================================================= */

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 60px;
        }


        .show-password {

            position: absolute;

            top: 50%;

            right: 12px;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color:
                rgba(255,255,255,.45);

            cursor: pointer;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: .05em;

            padding: 7px;
        }


        .show-password:hover {

            color: #f0c75e;
        }


        /* =================================================
           LOGIN BUTTON
        ================================================= */

        .login-btn {

            width: 100%;

            height: 52px;

            margin-top: 7px;

            border: 0;

            border-radius: 10px;

            background:
                #d7a62a;

            color:
                #07152f;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: .14em;

            cursor: pointer;

            transition:
                transform .3s ease,
                background .3s ease,
                box-shadow .3s ease;
        }


        .login-btn:hover {

            background:
                #f0c75e;

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(215,166,42,.18);
        }


        .login-btn:disabled {

            cursor: not-allowed;

            opacity: .55;

            transform: none;

            box-shadow: none;
        }


        /* =================================================
           MESSAGE
        ================================================= */

        .message {

            display: none;

            margin-top: 17px;

            padding:
                12px 14px;

            border-radius: 9px;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }


        .message.error {

            display: block;

            background:
                rgba(220,53,69,.10);

            border:
                1px solid
                rgba(220,53,69,.25);

            color:
                #ffb4bd;
        }


        .message.success {

            display: block;

            background:
                rgba(25,135,84,.10);

            border:
                1px solid
                rgba(25,135,84,.25);

            color:
                #9ee2bd;
        }


        /* =================================================
           FOOTER
        ================================================= */

        .login-footer {

            text-align: center;

            margin-top: 25px;

            color:
                rgba(255,255,255,.28);

            font-size: 9px;

            line-height: 1.6;

            letter-spacing: .03em;
        }


        .login-footer strong {

            color:
                rgba(255,255,255,.48);

            font-weight: 700;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 520px) {

            body {

                padding:
                    18px;
            }


            .login-card {

                padding:
                    35px 24px;

                border-radius: 17px;
            }


            .logo-box img {

                width: 130px;
            }


            h1 {

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <div class="login-wrapper">


        <!-- BACK -->

        <a
            href="index.html"
            class="back-home"
        >

            ← Back to SIR

        </a>


        <!-- CARD -->

        <div class="login-card">


            <!-- LOGO -->

            <div class="logo-box">

                <img
                    src="sir-logo.svg"
                    alt="SIR — Suryavanshi Institute for Rankers"
                >

            </div>


            <!-- TITLE -->

            <div class="portal-label">
                Teacher Portal
            </div>


            <h1>
                Welcome Back
            </h1>


            <p class="subtitle">

                Sign in to access your
                teaching dashboard.

            </p>


            <!-- FORM -->

            <form
                id="teacherLoginForm"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="teacher@sir.net.in"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            SHOW
                        </button>

                    </div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    SIGN IN
                </button>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                    role="alert"
                ></div>


            </form>


            <div class="login-footer">

                <strong>
                    SIR
                </strong>
                — WHERE POTENTIAL FINDS DIRECTION

                <br>

                Teacher access is restricted to
                authorised SIR faculty.

            </div>

        </div>

    </div>



    <!-- =====================================================
         SUPABASE LOGIN LOGIC
    ====================================================== -->

    <script>


        /* =================================================
           SUPABASE CONFIG
        ================================================= */

        const SUPABASE_URL =
            "https://asbyosqpupqspzvqqhfj.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_5kLRY64Pv5Ct-ZXuNtgEAw_51YUDqyw";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );



        /* =================================================
           ELEMENTS
        ================================================= */

        const form =
            document.getElementById(
                "teacherLoginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        const message =
            document.getElementById(
                "message"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );



        /* =================================================
           MESSAGE FUNCTION
        ================================================= */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }



        function clearMessage() {

            message.textContent = "";

            message.className =
                "message";

        }



        /* =================================================
           SHOW / HIDE PASSWORD
        ================================================= */

        showPassword.addEventListener(
            "click",
            () => {

                const isPassword =
                    passwordInput.type ===
                    "password";


                passwordInput.type =
                    isPassword
                        ? "text"
                        : "password";


                showPassword.textContent =
                    isPassword
                        ? "HIDE"
                        : "SHOW";

            }
        );



        /* =================================================
           LOGIN
        ================================================= */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                clearMessage();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password.",
                        "error"
                    );

                    return;

                }


                loginBtn.disabled =
                    true;

                loginBtn.textContent =
                    "SIGNING IN...";


                try {


                    /* =====================================
                       01 — SUPABASE AUTH
                    ====================================== */

                    const {
                        data: authData,
                        error: authError
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({
                                email,
                                password
                            });


                    if (authError) {

                        throw new Error(
                            "Invalid email or password."
                        );

                    }


                    const user =
                        authData.user;


                    if (!user) {

                        throw new Error(
                            "Authentication failed. Please try again."
                        );

                    }


                    /* =====================================
                       02 — FIND TEACHER PROFILE
                    ====================================== */

                    const {
                        data: teacher,
                        error: teacherError
                    } =
                        await supabaseClient
                            .from("teachers")
                            .select(`
                                id,
                                user_id,
                                full_name,
                                subject,
                                phone,
                                email,
                                is_active
                            `)
                            .eq(
                                "user_id",
                                user.id
                            )
                            .maybeSingle();


                    if (teacherError) {

                        console.error(
                            "Teacher profile error:",
                            teacherError
                        );

                        throw new Error(
                            "Unable to verify your teacher profile."
                        );

                    }


                    if (!teacher) {

                        await supabaseClient
                            .auth
                            .signOut();


                        throw new Error(
                            "No teacher profile is linked to this account."
                        );

                    }


                    /* =====================================
                       03 — ACTIVE CHECK
                    ====================================== */

                    if (
                        teacher.is_active !== true
                    ) {

                        await supabaseClient
                            .auth
                            .signOut();


                        throw new Error(
                            "Your teacher account is currently inactive. Please contact SIR administration."
                        );

                    }


                    /* =====================================
                       04 — SAVE BASIC SESSION INFO
                    ====================================== */

                    sessionStorage.setItem(
                        "sir_teacher_id",
                        teacher.id
                    );


                    sessionStorage.setItem(
                        "sir_teacher_user_id",
                        teacher.user_id
                    );


                    sessionStorage.setItem(
                        "sir_teacher_name",
                        teacher.full_name || ""
                    );


                    /* =====================================
                       05 — SUCCESS
                    ====================================== */

                    showMessage(
                        "Login successful. Opening Teacher Dashboard...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "teacher-dashboard.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(
                        "Teacher login error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Something went wrong. Please try again.",
                        "error"
                    );


                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        "SIGN IN";

                }

            }
        );

    </script>

</body>

</html>
