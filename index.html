<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIR — Suryavanshi Institute for Rankers</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* FULL SCREEN BACKGROUND */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;

      background-image:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.35)
        ),
        url("background.png");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* SUBTLE DARK VIGNETTE */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0,0,0,0.35) 100%
        );
    }

    /* CONTENT */
    .content {
      position: absolute;
      z-index: 2;

      top: 50%;
      left: 72%;

      transform: translate(-50%, -50%);

      width: min(420px, 40vw);

      text-align: center;
    }

    /* LOGO */
    .logo {
      display: block;

      width: 260px;
      max-width: 80%;

      height: auto;

      margin: 0 auto 35px;

      object-fit: contain;
    }

    /* MOTTO */
    .motto {
      font-size: 17px;
      font-weight: 600;

      letter-spacing: 4px;
      line-height: 1.6;

      color: #ffffff;

      text-transform: uppercase;

      margin-bottom: 32px;
    }

    /* COMING SOON */
    .coming {
      display: inline-flex;
      align-items: center;
      gap: 18px;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 4px;

      color: #e3b84b;

      text-transform: uppercase;
    }

    .coming::before,
    .coming::after {
      content: "";

      width: 28px;
      height: 1px;

      background: #e3b84b;
    }


    /* MOBILE */
    @media (max-width: 768px) {

      .hero {
        background-position: center center;
      }

      .content {
        top: auto;
        bottom: 12%;
        left: 50%;

        width: 90vw;
      }

      .logo {
        width: 210px;
        margin-bottom: 24px;
      }

      .motto {
        font-size: 13px;
        letter-spacing: 3px;
        margin-bottom: 24px;
      }

      .coming {
        font-size: 11px;
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <section class="content">

      <img
        src="sir logo.png"
        alt="Suryavanshi Institute for Rankers"
        class="logo"
      >

      <div class="motto">
        Where Potential Finds Direction
      </div>

      <div class="coming">
        Coming Soon
      </div>

    </section>

  </main>

</body>
</html>
